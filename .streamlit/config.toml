[browser]
# Не отправлять статистику в сеть: страница должна работать без интернета
gatherUsageStats = false

[server]
# Лимит на размер загружаемого фото в МБ. Держите равным MAX_UPLOAD_MB на бэкенде (backend/main.py)
maxUploadSize = 10

[theme]
font = "sans serif"
baseRadius = "large"
showWidgetBorder = true

# Светлая и тёмная темы. Streamlit сам выбирает по настройке системы.
[theme.light]
primaryColor = "#4F53D8"
backgroundColor = "#F4F5FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#141826"
borderColor = "#DCE0EC"

[theme.dark]
primaryColor = "#808BFA"
backgroundColor = "#0D111B"
secondaryBackgroundColor = "#151B28"
textColor = "#F1F3FA"
borderColor = "#2A3345"
