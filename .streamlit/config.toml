[theme]
font = "sans serif"
baseRadius = "large"
showWidgetBorder = true

# Светлая и тёмная темы. Streamlit сам выбирает по настройке системы.
[theme.light]
primaryColor = "#1A1AE6"
backgroundColor = "#F4F4F2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111111"
borderColor = "#E3E3DE"

[theme.dark]
primaryColor = "#8C97FF"
backgroundColor = "#0B0C10"
secondaryBackgroundColor = "#14161C"
textColor = "#F2F2F0"
borderColor = "#262A33"
